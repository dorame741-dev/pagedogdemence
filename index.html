<script>
(function(){
  'use strict';

  /* ---------- TIMER REGRESIVO ---------- */
  var MINUTOS = 15;                       // duración del contador
  var CLAVE   = 'lp_neuropet_es_fin';     // guarda el final en sessionStorage
  var reloj   = document.getElementById('reloj');
  var fin;

  try{
    fin = parseInt(sessionStorage.getItem(CLAVE), 10);
    if(!fin || isNaN(fin) || fin < Date.now()){
      fin = Date.now() + MINUTOS * 60 * 1000;
      sessionStorage.setItem(CLAVE, String(fin));
    }
  }catch(e){
    fin = Date.now() + MINUTOS * 60 * 1000;   // navegación privada / storage bloqueado
  }

  function dosDigitos(n){ return n < 10 ? '0' + n : String(n); }

  /* ---------- LIBERA O BOTÃO AOS 7:10 DE PÁGINA ---------- */
  var DURACAO_TOTAL_MS = MINUTOS * 60 * 1000;
  var SEGUNDOS_BOTAO = 7 * 60 + 10; // 430s
  var botaoLiberado = false;
  var botaoCta = document.getElementById('botao-cta');

  function liberarBotao(){
    if(botaoLiberado || !botaoCta) return;
    botaoLiberado = true;
    botaoCta.classList.remove('boton-oculto');
  }

  function tick(){
    var restante = Math.max(0, fin - Date.now());
    var total = Math.floor(restante / 1000);
    reloj.textContent = dosDigitos(Math.floor(total / 60)) + ':' + dosDigitos(total % 60);

    var transcorridoSeg = Math.floor((DURACAO_TOTAL_MS - restante) / 1000);
    if(transcorridoSeg >= SEGUNDOS_BOTAO) liberarBotao();

    if(restante <= 0) clearInterval(intervalo);
  }

  tick();
  var intervalo = setInterval(tick, 1000);
})();
</script>
